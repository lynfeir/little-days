<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Little Days — Baby Milestones & Memories</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Day-by-day milestone tracking, activity ideas, and a memory log for your baby. No account, no ads — everything stays on your device.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf3eb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#211b31">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little Days">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#faf3eb; --surface:#ffffff; --raised:#fff9f1;
  --text:#38304e; --muted:#7d7492; --line:rgba(56,48,78,.12);
  --accent:#e08856; --accent-soft:rgba(224,136,86,.14);
  --sage:#7fa477; --sage-soft:rgba(127,164,119,.16);
  --gold:#c9a452; --danger:#c4574d;
  --glow:rgba(224,136,86,.20);
  --shadow:0 6px 24px rgba(56,48,78,.08);
  --r:20px; --tap:48px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#211b31; --surface:#2a2340; --raised:#332b4c;
    --text:#f5efe6; --muted:#a99fc0; --line:rgba(245,239,230,.10);
    --accent:#f2a97e; --accent-soft:rgba(242,169,126,.14);
    --sage:#a9c7a1; --sage-soft:rgba(169,199,161,.14);
    --gold:#e8c87e; --danger:#e2837b;
    --glow:rgba(242,169,126,.16);
    --shadow:0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="light"]{
  --bg:#faf3eb; --surface:#ffffff; --raised:#fff9f1;
  --text:#38304e; --muted:#7d7492; --line:rgba(56,48,78,.12);
  --accent:#e08856; --accent-soft:rgba(224,136,86,.14);
  --sage:#7fa477; --sage-soft:rgba(127,164,119,.16);
  --gold:#c9a452; --danger:#c4574d;
  --glow:rgba(224,136,86,.20);
  --shadow:0 6px 24px rgba(56,48,78,.08);
}
:root[data-theme="dark"]{
  --bg:#211b31; --surface:#2a2340; --raised:#332b4c;
  --text:#f5efe6; --muted:#a99fc0; --line:rgba(245,239,230,.10);
  --accent:#f2a97e; --accent-soft:rgba(242,169,126,.14);
  --sage:#a9c7a1; --sage-soft:rgba(169,199,161,.14);
  --gold:#e8c87e; --danger:#e2837b;
  --glow:rgba(242,169,126,.16);
  --shadow:0 6px 24px rgba(0,0,0,.25);
}
/* ---------- base ---------- */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
.display{font-family:"Fraunces",Georgia,"Iowan Old Style",serif}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:8px}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}

/* ---------- app shell ---------- */
#app{max-width:560px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));}
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; justify-content:center; gap:2px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1; max-width:104px; min-height:var(--tap);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--muted); border-radius:14px; padding:6px 2px 4px;
  font-size:11px; font-weight:600; letter-spacing:.02em;
  transition:color .15s;
}
.tabbar[hidden]{display:none}
.tabbar button svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] .dotu{width:4px;height:4px;border-radius:2px;background:var(--accent)}
.dotu{width:4px;height:4px;border-radius:2px;background:transparent}

/* desktop: rail on the left, roomier canvas */
@media (min-width:900px){
  body{display:block}
  #app{max-width:680px; padding-left:24px; padding-right:24px; padding-bottom:48px}
  .tabbar{
    left:max(12px, calc(50vw - 340px - 130px)); right:auto; top:50%; bottom:auto; transform:translateY(-50%);
    flex-direction:column; width:96px; border:1px solid var(--line); border-radius:22px;
    padding:14px 8px; gap:6px; box-shadow:var(--shadow); background:color-mix(in srgb, var(--surface) 88%, transparent);
  }
  .tabbar button{max-width:none; font-size:11.5px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .grid2 .span2{grid-column:1 / -1}
}
@media (max-width:899px){ .grid2>*{margin-bottom:0} }

/* ---------- components ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 16px; box-shadow:var(--shadow); margin:0 0 14px;
}
.card h2{margin:0 0 4px; font-size:15px; font-weight:700; letter-spacing:.01em}
.card .sub{color:var(--muted); font-size:13px; margin:0 0 10px}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px;
  background:var(--raised); border:1px solid var(--line); font-size:12.5px; font-weight:600;
  color:var(--muted); font-variant-numeric:tabular-nums;
}
.chip.on{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); padding:10px 20px; border-radius:16px;
  background:var(--accent); color:var(--bg); font-weight:700; font-size:15px;
  border:none; transition:transform .1s, filter .15s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--raised); color:var(--text); border:1px solid var(--line)}
.btn.quiet{background:none; color:var(--accent); min-height:40px; padding:6px 10px}
.btn.danger{background:none; border:1px solid var(--danger); color:var(--danger)}
.btn.small{min-height:38px; padding:6px 14px; font-size:13.5px; border-radius:12px}
.row{display:flex; align-items:center; gap:10px}
.row.between{justify-content:space-between}
.stack{display:flex; flex-direction:column; gap:10px}

/* hero */
.hero{position:relative; padding:26px 4px 8px; margin-bottom:10px}
.hero .halo{
  position:absolute; top:-30px; left:50%; transform:translateX(-50%);
  width:280px; height:280px; border-radius:50%;
  background:radial-gradient(circle, var(--glow), transparent 65%);
  pointer-events:none; animation:breathe 5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.75; transform:translateX(-50%) scale(1)} 50%{opacity:1; transform:translateX(-50%) scale(1.07)}}
.hero .who{font-size:17px; color:var(--muted); margin:14px 0 0; position:relative}
.hero .age{
  font-size:clamp(38px, 11vw, 56px); line-height:1.08; font-weight:560;
  margin:2px 0 12px; position:relative; letter-spacing:-.01em; text-wrap:balance;
  font-variant-numeric:tabular-nums;
}
.hero .chips{display:flex; flex-wrap:wrap; gap:7px; position:relative}
.hero .brand{display:flex; align-items:center; justify-content:space-between; position:relative}
.hero .brand .date{font-size:12.5px; color:var(--muted); font-weight:600}

/* activity cards */
.acts{display:flex; flex-direction:column; gap:10px}
.act{
  display:flex; gap:12px; align-items:flex-start; padding:12px 13px;
  background:var(--raised); border:1px solid var(--line); border-radius:16px;
}
.act .e{font-size:24px; line-height:1.2; flex:none; margin-top:1px}
.act b{display:block; font-size:14.5px; margin-bottom:1px}
.act p{margin:0; font-size:13px; color:var(--muted); line-height:1.45}

/* phase note */
.phase{background:var(--sage-soft); border:none; }
.phase b{font-size:14px}
.phase p{margin:2px 0 0; font-size:13px; color:var(--muted)}

/* progress */
.bar{height:8px; border-radius:6px; background:var(--raised); border:1px solid var(--line); overflow:hidden}
.bar i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg, var(--accent), var(--gold)); transition:width .4s ease}

/* milestone pills */
.pills{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none; -ms-overflow-style:none}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex:none; min-height:40px; padding:7px 15px; border-radius:999px; font-weight:700; font-size:13.5px;
  background:var(--surface); border:1px solid var(--line); color:var(--muted);
  display:flex; align-items:center; gap:7px;
}
.pill .pct{font-size:10.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"]{background:var(--accent); color:var(--bg); border-color:transparent}
.pill[aria-pressed="true"] .pct{color:var(--bg)}
.pill .now{width:6px; height:6px; border-radius:3px; background:var(--gold); flex:none}

/* check rows */
.cat{margin:16px 0 6px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.check{
  display:flex; width:100%; text-align:left; gap:12px; align-items:flex-start;
  padding:11px 6px; min-height:var(--tap); border-radius:12px; border-bottom:1px solid var(--line);
}
.check:last-child{border-bottom:none}
.check .box{
  flex:none; width:26px; height:26px; border-radius:50%; margin-top:1px;
  border:2px solid var(--muted); display:flex; align-items:center; justify-content:center;
  transition:all .15s; color:transparent; font-size:15px; font-weight:800;
}
.check[aria-pressed="true"] .box{background:var(--sage); border-color:var(--sage); color:var(--bg)}
.check .lbl{font-size:14.5px; line-height:1.4}
.check[aria-pressed="true"] .lbl{color:var(--muted)}
.check .when{display:block; font-size:11.5px; color:var(--sage); font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums}
@keyframes pop{0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)}}
.check.justdid .box{animation:pop .35s ease}

/* firsts */
.firsts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.first{
  border-radius:18px; padding:14px 12px; text-align:left; min-height:104px;
  display:flex; flex-direction:column; gap:3px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
}
.first.todo{background:none; border:1.5px dashed var(--line); box-shadow:none; color:var(--muted)}
.first .e{font-size:26px}
.first b{font-size:13.5px; line-height:1.25}
.first .d{font-size:11.5px; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums}
.first .n{font-size:11.5px; color:var(--muted); font-style:italic; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

/* days list */
.day{
  display:flex; align-items:center; gap:13px; padding:11px 4px; border-bottom:1px solid var(--line);
}
.day:last-child{border-bottom:none}
.day .cal{
  flex:none; width:46px; text-align:center; background:var(--raised); border:1px solid var(--line);
  border-radius:12px; padding:5px 0 6px; font-variant-numeric:tabular-nums;
}
.day .cal .mo{display:block; font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
.day .cal .dd{display:block; font-size:17px; font-weight:700; line-height:1.1}
.day .t{flex:1; min-width:0}
.day .t b{display:block; font-size:14.5px}
.day .t span{font-size:12px; color:var(--muted)}
.day .in{flex:none}

/* forms */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-size:13px; font-weight:700; color:var(--muted)}
.field input[type="text"], .field input[type="date"], .field input[type="number"], .field select, .field textarea{
  min-height:var(--tap); padding:10px 14px; border-radius:14px; width:100%;
  background:var(--raised); border:1.5px solid var(--line); color:var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent); outline:none}
.seg{display:flex; background:var(--raised); border:1px solid var(--line); border-radius:14px; padding:4px; gap:4px}
.seg button{flex:1; min-height:40px; border-radius:10px; font-weight:700; font-size:13.5px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--bg)}

/* sheet + toast */
.backdrop{position:fixed; inset:0; background:rgba(20,15,35,.45); z-index:60; -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px)}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61; max-height:88dvh; overflow:auto;
  background:var(--surface); border-radius:24px 24px 0 0; border:1px solid var(--line); border-bottom:none;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
.sheet .grab{width:38px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 14px}
.sheet h3{margin:0 0 14px; font-size:17px}
@keyframes up{from{transform:translateY(40px); opacity:.5} to{transform:none; opacity:1}}
@media (min-width:700px){
  .sheet{left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%); width:min(440px, 92vw); border-radius:24px; border-bottom:1px solid var(--line); animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0; transform:translate(-50%,-48%)} to{opacity:1; transform:translate(-50%,-50%)}}
}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom)); z-index:70;
  background:var(--text); color:var(--bg); padding:10px 20px; border-radius:999px; font-weight:700; font-size:14px;
  box-shadow:var(--shadow); animation:up .2s ease; max-width:88vw; text-align:center;
}
@media (min-width:900px){ .toast{bottom:40px} }

/* onboarding */
.onb{min-height:88dvh; display:flex; flex-direction:column; justify-content:center; padding:10px 2px}
.onb .moon{font-size:52px; margin-bottom:6px}
.onb h1{font-size:clamp(34px,9vw,44px); margin:0 0 6px; font-weight:600; letter-spacing:-.01em}
.onb .lede{color:var(--muted); font-size:16px; margin:0 0 26px; max-width:34ch}
.onb .fine{font-size:12.5px; color:var(--muted); margin-top:16px; line-height:1.5}

details.past summary{cursor:pointer; min-height:var(--tap); display:flex; align-items:center; font-weight:700; font-size:14px; color:var(--muted); list-style:none}
details.past summary::-webkit-details-marker{display:none}

.note{font-size:12.5px; color:var(--muted); line-height:1.5}
.center{text-align:center}
hr.soft{border:none; border-top:1px solid var(--line); margin:16px 0}
#fx{position:fixed; inset:0; pointer-events:none; z-index:80}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>

<div id="app"></div>

/* ---------- date utils (all local-time, no UTC surprises) ---------- */
const DAY = 864e5;
const p2 = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const fromISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const diffDays = (a,b) => Math.round((b - a) / DAY);
const fmtLong = d => d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
const fmtMed  = d => d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
const fmtShort= d => d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
function addMonthsClamp(d, n){
  const y = d.getFullYear(), m = d.getMonth() + n, day = d.getDate();
  const last = new Date(y, m+1, 0).getDate();
  return new Date(y, m, Math.min(day, last));
}
function calAge(dob, now){
  let y = now.getFullYear() - dob.getFullYear();
  let m = now.getMonth() - dob.getMonth();
  let d = now.getDate() - dob.getDate();
  if (d < 0){ d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); m--; }
  if (m < 0){ m += 12; y--; }
  return {y, m, d, months: y*12+m};
}
const ordinal = n => n + (n%10==1&&n%100!=11?'st':n%10==2&&n%100!=12?'nd':n%10==3&&n%100!=13?'rd':'th');
function mulberry(seed){ return function(){ seed|=0; seed = seed+0x6D2B79F5|0; let t = Math.imul(seed^seed>>>15, 1|seed); t = t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- derived ---------- */
function ages(){
  const t = today0();
  const dob = fromISO(S.profile.dob);
  const days = diffDays(dob, t);
  const cal = calAge(dob, t);
  const early = S.profile.earlyWeeks || 0;
  let adj = null;
  if (early > 0 && cal.months < 24){
    const dobAdj = new Date(dob.getTime() + early*7*DAY);
    const adjDays = Math.max(0, diffDays(dobAdj, t));
    adj = { cal: calAge(dobAdj, t), days: adjDays };
  }
  const effMonths = adj ? (adj.cal.months + adj.cal.d/30) : (cal.months + cal.d/30);
  return { t, dob, days, weeks: Math.floor(days/7), cal, adj, effMonths };
}
function currentBracket(effMonths){
  return BRACKETS.find(b => effMonths <= b) || 60;
}
function bracketProgress(m){
  const b = MILESTONES.find(x => x.m === m);
  let total = 0, done = 0;
  for (const c in b.cats){ b.cats[c].forEach((_,i) => { total++; if (S.checks[`${m}:${c}:${i}`]) done++; }); }
  return {total, done};
}
function specialDays(){
  const dob = fromISO(S.profile.dob);
  const name = S.profile.name;
  const list = [];
  for (let n=1; n<=11; n++) list.push({date: addMonthsClamp(dob,n), e:'🎈', t:`${n}-month day`});
  list.push({date: new Date(dob.getTime()+99*DAY), e:'💯', t:`100 days of ${name}`});
  list.push({date: new Date(dob.getTime()+999*DAY), e:'✨', t:`1,000 days of ${name}`});
  for (let k=0; k<5; k++) list.push({date: addMonthsClamp(dob, k*12+6), e:'🌗', t: k===0 ? '½ birthday' : `${k}½ birthday`});
  for (let k=1; k<=5; k++) list.push({date: addMonthsClamp(dob, k*12), e:'🎂', t:`${ordinal(k)} birthday`});
  const t = today0();
  (S.customDays||[]).forEach(cd => {
    let d = fromISO(cd.date);
    if (cd.yearly){
      let next = new Date(t.getFullYear(), d.getMonth(), Math.min(d.getDate(), new Date(t.getFullYear(), d.getMonth()+1,0).getDate()));
      if (diffDays(t, next) < 0) next = new Date(t.getFullYear()+1, d.getMonth(), d.getDate());
      list.push({date: next, e: cd.e||'💖', t: cd.t, custom: cd.id, yearly:true});
      if (diffDays(t, d) < 0 && d.getFullYear() !== next.getFullYear()) {} // original past occurrence not listed
    } else {
      list.push({date: d, e: cd.e||'💖', t: cd.t, custom: cd.id});
    }
  });
  const upcoming = list.filter(x => diffDays(t, x.date) >= 0).sort((a,b) => a.date-b.date);
  const past = list.filter(x => diffDays(t, x.date) < 0).sort((a,b) => b.date-a.date);
  return {upcoming, past};
}
function todaysActivities(){
  const a = ages();
  const band = ACTIVITIES.find(b => a.effMonths >= b.from && a.effMonths < b.to) || ACTIVITIES[ACTIVITIES.length-1];
  const seed = diffDays(new Date(2024,0,1), a.t) + (state.shuffle*7919);
  const rnd = mulberry(seed);
  const pool = band.list.slice();
  for (let i=pool.length-1; i>0; i--){ const j = Math.floor(rnd()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
  return pool.slice(0,3);
}
function activePhases(){
  const a = ages();
  return PHASES.filter(p => a.effMonths >= p.from && a.effMonths < p.to).slice(0,2);
}

function toast(msg){

let sheetEl = null, backEl = null;
function openSheet(html){
  closeSheet();
  backEl = document.createElement('div'); backEl.className = 'backdrop';
  backEl.addEventListener('click', closeSheet);
  sheetEl = document.createElement('div'); sheetEl.className = 'sheet';
  sheetEl.setAttribute('role','dialog'); sheetEl.setAttribute('aria-modal','true');

/* ---------- confetti ---------- */
const fx = document.getElementById('fx');
const fctx = fx.getContext('2d');
let parts = [], fxRunning = false;
function confetti(x, y){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio;
  fctx.scale(devicePixelRatio, devicePixelRatio);
  const colors = ['#f2a97e','#a9c7a1','#e8c87e','#f5efe6','#e08856'];
  for (let i=0; i<70; i++){
    parts.push({
      x: x ?? innerWidth/2, y: y ?? innerHeight*0.3,
      vx: (Math.random()-.5)*7, vy: -Math.random()*8-2,
      s: Math.random()*5+3, r: Math.random()*Math.PI,
      vr: (Math.random()-.5)*.3, c: colors[i%colors.length],
      life: 1, circle: Math.random()>.5
    });
  }
  if (!fxRunning){ fxRunning = true; requestAnimationFrame(tick); }
}
function tick(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.life > 0);
  if (!parts.length){ fxRunning = false; return; }
  for (const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += .25; p.r += p.vr; p.life -= .012;
    fctx.save(); fctx.globalAlpha = Math.max(0,p.life); fctx.translate(p.x,p.y); fctx.rotate(p.r);
    fctx.fillStyle = p.c;
    if (p.circle){ fctx.beginPath(); fctx.arc(0,0,p.s/2,0,7); fctx.fill(); }
    else fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);
    fctx.restore();
  }
  requestAnimationFrame(tick);
}

function heroAge(){

    return `${m} month${m===1?'':'s'}, ${a.cal.d} day${a.cal.d===1?'':'s'}`;
  }
  return `${a.cal.y} year${a.cal.y===1?'':'s'}, ${a.cal.m} month${a.cal.m===1?'':'s'}`;
}

    <h1 class="display" style="font-size:30px;margin:0 0 4px;font-weight:600">Milestones</h1>

    }).join('')}

      <div class="cat">${CATS[c].e} ${CATS[c].n}</div>

        const key = `${sel.m}:${c}:${i}`;

          <span class="box">✓</span>

function earlierUnchecked(cur){
  let n = 0;
  MILESTONES.filter(b => b.m < cur).forEach(b => {
    for (const c in b.cats) b.cats[c].forEach((_,i) => { if (!S.checks[`${b.m}:${c}:${i}`]) n++; });
  });
  return n;
}

           <div class="act"><span class="e">2️⃣</span><div><b>Tap the Share button</b><p>The square with the arrow, bottom of the screen.</p></div></div>
           <div class="act"><span class="e">3️⃣</span><div><b>“Add to Home Screen”</b><p>Scroll down a little to find it, then tap Add.</p></div></div>`
        : `<div class="act"><span class="e">🤖</span><div><b>Android · Chrome</b><p>Menu (⋮) → “Add to Home screen” → Install.</p></div></div>
           <div class="act"><span class="e">💻</span><div><b>Desktop · Chrome or Edge</b><p>Click the install icon at the right end of the address bar.</p></div></div>
           <div class="act"><span class="e">🍎</span><div><b>iPhone · Safari</b><p>Share button → “Add to Home Screen”.</p></div></div>`}
    </div>`);
}

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const nav2 = e.target.closest('[data-nav2]'); if (nav2){ nav(nav2.dataset.nav2); return; }
  const pill = e.target.closest('[data-bracket]'); if (pill){ state.bracket = Number(pill.dataset.bracket); render(); return; }
  const chk = e.target.closest('[data-check]');
  if (chk){
    const key = chk.dataset.check;
    if (S.checks[key]) delete S.checks[key];
    else {
      S.checks[key] = isoOf(today0());
      const r = chk.getBoundingClientRect();
      confetti(r.left + 20, r.top + 10);
    }
    save(); render(); return;
  }
  const first = e.target.closest('[data-first]'); if (first){ firstSheet(first.dataset.first); return; }
  const saveF = e.target.closest('[data-save-first]');
  if (saveF){
    const id = saveF.dataset.saveFirst;
    const date = document.getElementById('fs-date').value;
    const note = document.getElementById('fs-note').value.trim();
    if (!date) return;
    S.firsts = (S.firsts||[]).filter(f => f.id !== id);
    const preset = FIRST_PRESETS.find(p => p.id === id);
    const old = null;
    S.firsts.push(preset ? {id, e:preset.e, t:preset.t, date, note} : Object.assign({custom:true}, (S._editCustom||{}), {id, date, note}));
    delete S._editCustom;
    save(); closeSheet(); render(); confetti(); toast('Saved 💛');
    return;
  }
  const remF = e.target.closest('[data-remove-first]');
  if (remF){
    S.firsts = (S.firsts||[]).filter(f => f.id !== remF.dataset.removeFirst);
    save(); closeSheet(); render(); toast('Removed');
    return;
  }
  const delDay = e.target.closest('[data-del-day]');
  if (delDay){
    S.customDays = (S.customDays||[]).filter(d => d.id !== delDay.dataset.delDay);
    save(); render(); toast('Removed');
    return;
  }
  const themeSet = e.target.closest('[data-theme-set]');
  if (themeSet){ S.settings.theme = themeSet.dataset.themeSet; save(); render(); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  switch (act.dataset.act){
    case 'shuffle': state.shuffle++; render(); break;
    case 'add-first': customFirstSheet(); break;
    case 'save-custom-first': {
      const t = document.getElementById('cf-title').value.trim();
      const date = document.getElementById('cf-date').value;
      if (!t || !date){ toast('Give it a name and a date'); break; }
      S.firsts = S.firsts || [];
      S.firsts.push({ id:'c'+Date.now(), custom:true, e:(document.getElementById('cf-emoji').value.trim()||'💛').slice(0,4), t, date, note:document.getElementById('cf-note').value.trim() });
      save(); closeSheet(); render(); confetti(); toast('Saved 💛');
      break;
    }
    case 'add-day': customDaySheet(); break;
    case 'save-custom-day': {
      const t = document.getElementById('cd-title').value.trim();
      const date = document.getElementById('cd-date').value;
      if (!t || !date){ toast('Give it a name and a date'); break; }
      S.customDays = S.customDays || [];
      S.customDays.push({ id:'d'+Date.now(), t, date, yearly:document.getElementById('cd-yearly').checked, e:(document.getElementById('cd-emoji').value.trim()||'💖').slice(0,4) });
      save(); closeSheet(); render(); toast('Added ✓');
      break;
    }
    case 'save-profile': {
      const name = document.getElementById('pf-name').value.trim();
      const dob = document.getElementById('pf-dob').value;
      if (!name || !dob){ toast('Name and birthday are required'); break; }
      S.profile = { name, dob, earlyWeeks:Number(document.getElementById('pf-early').value||0) };
      state.bracket = null;
      save(); render(); toast('Saved ✓');
      break;
    }
    case 'export': {
      const data = JSON.stringify(S, null, 2);
      const blob = new Blob([data], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `little-days-backup-${isoOf(today0())}.json`;
      a.click(); URL.revokeObjectURL(a.href);
      S.settings.lastBackup = isoOf(today0()); save(); render(); toast('Backup exported ✓');
      break;
    }
    case 'copy': {
      navigator.clipboard.writeText(JSON.stringify(S)).then(
        () => { S.settings.lastBackup = isoOf(today0()); save(); render(); toast('Backup copied ✓'); },
        () => toast('Couldn’t copy — try Export instead'));
      break;
    }
    case 'import': document.getElementById('import-file').click(); break;
    case 'reset':
      openSheet(`<h3>Erase everything?</h3>
        <p class="note" style="margin:0 0 16px">This wipes ${esc(S.profile?.name||'baby')}’s data from this device. There is no undo.</p>
        <div class="row"><button class="btn danger" style="flex:1" data-act="reset-confirm">Yes, erase it all</button>
        <button class="btn ghost" style="flex:1" data-act="sheet-close">Keep it</button></div>`);
      break;
    case 'reset-confirm':
      S = { v:1, profile:null, checks:{}, firsts:[], customDays:[], settings:{theme:'auto', installDismissed:false, lastBackup:null} };
      save(); closeSheet(); state.view='today'; render();
      break;
    case 'sheet-close': closeSheet(); break;
    case 'install': installSheet(); break;
    case 'install-now':
      if (state.deferredPrompt){ state.deferredPrompt.prompt(); state.deferredPrompt = null; closeSheet(); }
      break;
    case 'install-dismiss': S.settings.installDismissed = true; save(); render(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'import-file'){
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if (!data || data.v !== 1 || !data.profile || !data.profile.dob) throw new Error('bad');
        S = data; S.settings = Object.assign({theme:'auto', installDismissed:false, lastBackup:null}, S.settings||{});
        save(); state.bracket = null; render(); toast(`Welcome back, ${S.profile.name} 💛`);
      }catch(err){ toast('That file isn’t a Little Days backup'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  }
});

/* ---------- theme + install + sw ---------- */
function applyTheme(){
  const t = S.settings.theme || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  requestAnimationFrame(() => {
    const bg = getComputedStyle(document.body).backgroundColor;
    let meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (!meta){ meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
    meta.content = bg;
  });
}
function isStandalone(){
  return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  state.deferredPrompt = e;
});
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ---------- boot ---------- */
state.view = ['today','milestones','firsts','days','more'].includes(location.hash.replace('#','')) ? location.hash.replace('#','') : 'today';
render();
console.log('Little Days v' + VERSION + ' — hi, tiny human 👋');
</script>
